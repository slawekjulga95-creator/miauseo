<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d">
  <title id="t">Jak przejąć lokalną firmę w Business Hub ChatGPT</title>
  <desc id="d">Cztery kroki: wyszukaj firmę na chatgpt.com/business-hub, potwierdź kontakt kodem SMS lub połączeniem na numer z wpisu, e-mailem firmowym albo rekordem TXT w DNS, przejdź weryfikację tożsamości Persona, uzupełnij profil firmy.</desc>
  <rect width="900" height="470" fill="#ffffff"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="270" y="20" width="360" height="70" rx="18" fill="#16181d"/>
    <text x="450" y="52" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">Przejęcie firmy w ChatGPT</text>
    <text x="450" y="76" text-anchor="middle" font-size="15" fill="#ffb27a">chatgpt.com/business-hub</text>
    <rect x="40" y="120" width="390" height="140" rx="18" fill="#fff4ec" stroke="#FF6A00" stroke-width="2"/>
    <circle cx="80" cy="160" r="22" fill="#FF6A00"/><text x="80" y="168" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">1</text>
    <text x="115" y="167" font-size="19" font-weight="800" fill="#16181d">Wyszukaj firmę</text>
    <text x="62" y="208" font-size="15" fill="#3f3f46">wpisz nazwę i wybierz wpis,</text>
    <text x="62" y="232" font-size="15" fill="#3f3f46">który pasuje do Twojej firmy</text>
    <rect x="470" y="120" width="390" height="140" rx="18" fill="#fff4ec" stroke="#FF6A00" stroke-width="2"/>
    <circle cx="510" cy="160" r="22" fill="#FF6A00"/><text x="510" y="168" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">2</text>
    <text x="545" y="167" font-size="19" font-weight="800" fill="#16181d">Potwierdź kontakt</text>
    <text x="492" y="204" font-size="15" fill="#3f3f46">SMS lub połączenie na numer z wpisu</text>
    <text x="492" y="226" font-size="15" fill="#3f3f46">(zwykle ten z wizytówki Google),</text>
    <text x="492" y="248" font-size="15" fill="#3f3f46">e-mail firmowy albo rekord TXT w DNS</text>
    <rect x="40" y="290" width="390" height="140" rx="18" fill="#f4f4f5"/>
    <circle cx="80" cy="330" r="22" fill="#16181d"/><text x="80" y="338" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">3</text>
    <text x="115" y="337" font-size="19" font-weight="800" fill="#16181d">Weryfikacja Persona</text>
    <text x="62" y="378" font-size="15" fill="#3f3f46">dowód osobisty, dane rejestrowe</text>
    <text x="62" y="402" font-size="15" fill="#3f3f46">i prawo do reprezentowania firmy</text>
    <rect x="470" y="290" width="390" height="140" rx="18" fill="#ecfdf3"/>
    <circle cx="510" cy="330" r="22" fill="#15803d"/><text x="510" y="338" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">4</text>
    <text x="545" y="337" font-size="19" font-weight="800" fill="#16181d">Uzupełnij profil</text>
    <text x="492" y="378" font-size="15" fill="#3f3f46">strona, opis, kategoria usług,</text>
    <text x="492" y="402" font-size="15" fill="#3f3f46">logo, zdjęcia, statystyki</text>
  </g>
</svg>
