<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d">
  <title id="t">Kto może już przejąć firmę w Business Hub ChatGPT</title>
  <desc id="d">Schemat decyzji, stan na 24 listopada 2026: lokalny sklep, restauracja lub usługa z adresem w Polsce na razie nie może przejąć wpisu, bo dla firm lokalnych dostępne są tylko wpisy z USA. Sklep internetowy lub usługa online spoza USA może, od 19 listopada 2026.</desc>
  <rect width="900" height="470" fill="#ffffff"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="270" y="24" width="360" height="78" rx="18" fill="#16181d"/>
    <text x="450" y="58" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">Jaką masz firmę?</text>
    <text x="450" y="84" text-anchor="middle" font-size="15" fill="#ffb27a">stan na 24 listopada 2026</text>
    <path d="M360 102 L210 170 M540 102 L690 170" stroke="#FF6A00" stroke-width="3" fill="none"/>
    <rect x="40" y="170" width="350" height="96" rx="18" fill="#fff4ec" stroke="#FF6A00" stroke-width="2"/>
    <text x="215" y="208" text-anchor="middle" font-size="18" font-weight="800" fill="#16181d">Lokalny sklep, restauracja,</text>
    <text x="215" y="234" text-anchor="middle" font-size="18" font-weight="800" fill="#16181d">usługa z adresem w Polsce</text>
    <rect x="510" y="170" width="350" height="96" rx="18" fill="#fff4ec" stroke="#FF6A00" stroke-width="2"/>
    <text x="685" y="208" text-anchor="middle" font-size="18" font-weight="800" fill="#16181d">Sklep internetowy</text>
    <text x="685" y="234" text-anchor="middle" font-size="18" font-weight="800" fill="#16181d">albo usługa online</text>
    <path d="M215 266 V306 M685 266 V306" stroke="#FF6A00" stroke-width="3"/>
    <rect x="40" y="306" width="350" height="136" rx="18" fill="#f4f4f5"/>
    <text x="215" y="342" text-anchor="middle" font-size="20" font-weight="800" fill="#b91c1c">Jeszcze nie</text>
    <text x="215" y="370" text-anchor="middle" font-size="15" fill="#3f3f46">wpisy lokalne tylko z USA.</text>
    <text x="215" y="394" text-anchor="middle" font-size="15" fill="#3f3f46">Przygotuj dane i stronę,</text>
    <text x="215" y="418" text-anchor="middle" font-size="15" fill="#3f3f46">żeby zgłosić się od razu</text>
    <rect x="510" y="306" width="350" height="136" rx="18" fill="#ecfdf3"/>
    <text x="685" y="342" text-anchor="middle" font-size="20" font-weight="800" fill="#15803d">Tak, od 19.11.2026</text>
    <text x="685" y="370" text-anchor="middle" font-size="15" fill="#3f3f46">chatgpt.com/business-hub:</text>
    <text x="685" y="394" text-anchor="middle" font-size="15" fill="#3f3f46">weryfikacja kontaktu, potem</text>
    <text x="685" y="418" text-anchor="middle" font-size="15" fill="#3f3f46">tożsamości przez Persona</text>
  </g>
</svg>
